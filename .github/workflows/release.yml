name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS Builds ---
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            arch_name: 'macos-arm'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            arch_name: 'macos-intel'

          # --- Linux Build ---
          - platform: 'ubuntu-22.04'
            args: ''
            target: ''
            arch_name: 'linux-x64'

          # --- Windows Builds ---
          - platform: 'windows-latest'
            args: ''
            target: ''
            arch_name: 'windows-x64'
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'
            arch_name: 'windows-arm'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Now uses the clean 'target' key from the matrix
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libnm-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Release (Private Repo)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Celerix ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Mirror Release to Public Repo
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repo_name: DonkersSolutions/Celerix
          # The double asterisk safely finds the installers in any subfolder
          file: src-tauri/target/**/release/bundle/*/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          release_name: 'Celerix ${{ github.ref_name }}'
          body: 'Platform: ${{ matrix.arch_name }}'